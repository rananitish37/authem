services:
  mysql-db:
    image: mysql:8.0
    container_name: authem-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: authem_user_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  authem-auth-service:
    build: .
    container_name: authem-auth-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/authem_user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8081
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data: